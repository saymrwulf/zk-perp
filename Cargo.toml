[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/orderbook",
    "crates/state",
    "crates/oracle",
    "crates/da",
    "methods",
    "host",
    "sequencer",
    "verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["zk-perp contributors"]

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Crypto
ed25519-dalek = { version = "2.0", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"

# ZK / Merkle
light-poseidon = "0.2"
ark-bn254 = "0.4"
ark-ff = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
zk-perp-core = { path = "crates/core" }
zk-perp-orderbook = { path = "crates/orderbook" }
zk-perp-state = { path = "crates/state" }
zk-perp-oracle = { path = "crates/oracle" }
zk-perp-da = { path = "crates/da" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
